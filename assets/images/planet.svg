<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Amar's TechSpace mark: a ringed planet in the brand gradient (yellow, pink, blue).
       The ring spins forever: its colors flow around it and a glint orbits behind and in front of the planet -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset=".5" stop-color="#ff7eb6"/>
      <stop offset="1" stop-color="#7ce7ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset=".5" stop-color="#ff7eb6"/>
      <stop offset="1" stop-color="#7ce7ff"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-22 32 32)" fill="none" stroke-width="3.6" stroke-linecap="round">
    <!-- back half of the ring, behind the planet -->
    <path d="M5 32A27 8.5 0 0 1 59 32" stroke="url(#ring)"/>
    <path d="M5 32A27 8.5 0 0 1 59 32" pathLength="100" stroke="#fff" stroke-opacity="1" stroke-dasharray="26 200" stroke-dashoffset="26">
      <animate attributeName="stroke-dashoffset" values="26;-100;-100" keyTimes="0;.5;1" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="32" cy="32" r="14.5" fill="url(#g)" stroke="none"/>
    <!-- front half of the ring, over the planet (drawn right to left so the glint keeps orbiting) -->
    <path d="M59 32A27 8.5 0 0 1 5 32" stroke="url(#ring)"/>
    <path d="M59 32A27 8.5 0 0 1 5 32" pathLength="100" stroke="#fff" stroke-opacity="1" stroke-dasharray="26 200" stroke-dashoffset="26">
      <animate attributeName="stroke-dashoffset" values="26;26;-100" keyTimes="0;.5;1" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="53" cy="12" r="2.6" fill="#ffd166"/>
  <circle cx="11" cy="52" r="1.8" fill="#7ce7ff"/>
</svg>
