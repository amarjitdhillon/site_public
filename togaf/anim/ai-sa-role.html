<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Principal AI Solution Architect roles and responsibilities</title>
<style>
:root{--bg:#fff;--fg:#1f2330;--muted:#6b7280;--accent:#5b5bf7;--btn:#eef0ff}
@media (prefers-color-scheme:dark){:root{--bg:#16181f;--fg:#e8e9ef;--muted:#9aa0ad;--btn:#2a2d3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{display:flex;flex-direction:column;height:100vh}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{width:100%;height:100%;background:#fff;border-radius:10px}
.s{transition:opacity .45s ease}
.flow{display:none;stroke-dasharray:6 10;animation:flow .8s linear infinite}
body[data-s='1'] .s2,body[data-s='1'] .s3,body[data-s='1'] .s4,body[data-s='1'] .s5,body[data-s='1'] .s6,body[data-s='1'] .s7{opacity:.07}
body[data-s='1'] .f1{display:inline}
body[data-s='2'] .s3,body[data-s='2'] .s4,body[data-s='2'] .s5,body[data-s='2'] .s6,body[data-s='2'] .s7{opacity:.07}
body[data-s='2'] .f2{display:inline}
body[data-s='3'] .s4,body[data-s='3'] .s5,body[data-s='3'] .s6,body[data-s='3'] .s7{opacity:.07}
body[data-s='3'] .f3{display:inline}
body[data-s='4'] .s5,body[data-s='4'] .s6,body[data-s='4'] .s7{opacity:.07}
body[data-s='4'] .f4{display:inline}
body[data-s='5'] .s6,body[data-s='5'] .s7{opacity:.07}
body[data-s='5'] .f5{display:inline}
body[data-s='6'] .s7{opacity:.07}
body[data-s='6'] .f6{display:inline}
body[data-s='7'] .f7{display:inline}
@keyframes flow{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){.s{transition:none}.flow{animation:none!important;display:none!important}}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid rgba(127,127,127,.25);flex-wrap:wrap}
.cap{flex:1;min-width:200px}.cap b{display:block;font-size:15px}.cap span{color:var(--muted);font-size:13px}
.dots{display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--btn)}.dots i.on{background:var(--accent)}
.hot{cursor:help}
.tip{position:fixed;z-index:5;max-width:260px;padding:8px 11px;border-radius:9px;background:#10123a;color:#fff;font-size:12.5px;line-height:1.35;
box-shadow:0 10px 28px rgba(0,0,0,.28);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .35s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1)}
.tip.on{opacity:1;transform:none}.tip b{display:block;color:#ffd166;font-size:12px;margin-bottom:2px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:8px 14px;background:var(--btn);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);color:#fff}button:disabled{opacity:.4;cursor:default}
</style></head>
